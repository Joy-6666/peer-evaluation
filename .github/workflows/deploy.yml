name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_FIREBASE_API_KEY: AIzaSyDwapqEjGBMpVSparXzfFizatkWKWdqWNY
          VITE_FIREBASE_AUTH_DOMAIN: peer-evaluation-38f59.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: peer-evaluation-38f59
          VITE_FIREBASE_APP_ID: 1:210925957010:web:5de2ef9c8c4eff53241b4b
          VITE_ADMIN_EMAILS: jau@go.ypmhs.tyc.edu.tw
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
